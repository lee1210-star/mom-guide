<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-title" content="엄마전용 휴대폰 설명서">
<title>유튜브 보기</title>
<link rel="stylesheet" href="../style.css?v=86369bb9">
<noscript><meta http-equiv="refresh" content="0; url=1.html"></noscript>
</head>
<body>
<div id="stage">
  <div id="sheetBox"><img id="sheet" src="" alt=""></div>
  <div id="zonePrev" class="zone"><span class="arrow"><i></i></span></div>
  <div id="zoneNext" class="zone"><span class="arrow"><i></i></span></div>
  <div id="sideInfo"><div class="count" id="countLabel"></div><div class="track"><div class="fill" id="fillBar"></div></div></div>
  <p id="whereTitle">유튜브 보기</p>
  <div id="endBanner" hidden>끝까지 다 보셨어요. 잘하셨어요!</div>
</div>
<script>
(function () {
  var PAGES = ["img/p01.png?v=78d48838", "img/p02.png?v=92ce51aa", "img/p03.png?v=962bd9f8", "img/p04.png?v=b8aeea7f", "img/p05.png?v=86bf34ce", "img/p06.png?v=3fb60405", "img/p07.png?v=fc6d32c0", "img/p08.png?v=0e3b66de", "img/p09.png?v=d1a32c63", "img/p10.png?v=2cfc9d25", "img/p11.png?v=87abcbc5", "img/p12.png?v=62d6696f", "img/p13.png?v=99e44fbc", "img/p14.png?v=0fbee96c"];
  var TITLES = ["사랑하는 엄마께", "유튜브로 할 수 있는 것", "유튜브 열기", "처음 뜨는 창 닫기", "돋보기 누르기", "글자로 적어서 찾기", "말로 찾기 (마이크)", "찾은 영상 고르기", "광고가 나오면 넘기기", "보는 중에 쓰는 버튼", "다 보고 나오기", "유튜브 사기 조심", "눌러도 되는 것, 누르면 안 되는 것", "자녀분께 드리는 메모"];
  var i = 0;
  var n = PAGES.length;
  var sheet = document.getElementById('sheet');
  var count = document.getElementById('countLabel');
  var fill = document.getElementById('fillBar');
  var zonePrev = document.getElementById('zonePrev');
  var zoneNext = document.getElementById('zoneNext');
  var endBanner = document.getElementById('endBanner');
  var pre = new Image();

  function render() {
    sheet.src = PAGES[i];
    sheet.alt = (i + 1) + '쪽: ' + TITLES[i];
    count.textContent = (i + 1) + ' / ' + n;
    fill.style.height = Math.round((i + 1) / n * 100) + '%';
    zonePrev.className = 'zone' + (i === 0 ? ' off' : '');
    zoneNext.className = 'zone' + (i === n - 1 ? ' off' : '');
    endBanner.hidden = (i !== n - 1);
    if (i + 1 < n) { pre.src = PAGES[i + 1]; }
    if (i > 0) { pre.src = PAGES[i - 1]; }
  }

  function tryFullscreen() {
    try {
      var el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) {
        el.requestFullscreen().catch(function () {});
      }
    } catch (e) {}
  }

  zoneNext.addEventListener('click', function () {
    if (i < n - 1) { i++; render(); }
    tryFullscreen();
  });
  zonePrev.addEventListener('click', function () {
    if (i > 0) { i--; render(); }
    tryFullscreen();
  });

  // 화면을 손가락으로 밀어도 쪽이 넘어가게 (너무 예민하지 않게 일정 거리 이상 밀어야 넘어감)
  var stage = document.getElementById('stage');
  var touchX = 0, touchY = 0, touching = false;
  var SWIPE_MIN = 70;
  stage.addEventListener('touchstart', function (e) {
    if (e.changedTouches.length !== 1) { touching = false; return; }
    touching = true;
    touchX = e.changedTouches[0].clientX;
    touchY = e.changedTouches[0].clientY;
  }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (!touching) { return; }
    touching = false;
    var dx = e.changedTouches[0].clientX - touchX;
    var dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) < SWIPE_MIN || Math.abs(dx) < Math.abs(dy) * 1.3) { return; }
    if (dx < 0 && i < n - 1) { i++; render(); }
    else if (dx > 0 && i > 0) { i--; render(); }
    tryFullscreen();
  }, { passive: true });

  render();
})();
</script>
</body>
</html>
