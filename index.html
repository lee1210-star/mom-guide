<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-title" content="엄마 설명서">
<title>엄마 설명서</title>
<style>
  /* 아주 오래된 사파리(iOS 9)에서도 되도록: 자바스크립트·웹폰트·grid 안 씀 */
  body {
    margin: 0;
    padding: 24px 28px 48px;
    background: #f3eee4;
    color: #2b2723;
    font-family: "Apple SD Gothic Neo", "AppleSDGothicNeo-Regular", "Malgun Gothic", sans-serif;
    font-size: 26px;
    line-height: 1.6;
    letter-spacing: 0.02em;
    -webkit-text-size-adjust: 100%;
  }
  h1 {
    font-size: 40px;
    line-height: 1.3;
    margin: 8px 0 24px;
    padding-bottom: 14px;
    border-bottom: 4px solid #c9bfae;
  }
  .box {
    background: #fbf8f2;
    border: 3px solid #d8cfbf;
    border-radius: 14px;
    padding: 20px 24px;
    margin: 0 0 24px;
  }
  .ok {
    border-color: #8fae94;
    background: #eef3ec;
  }
  .ok b { color: #3f6b48; }
  img {
    display: block;
    width: 100%;
    max-width: 1024px;
    height: auto;
    border-radius: 10px;
  }
  .small { font-size: 20px; color: #6b6258; }
</style>
</head>
<body>
  <h1>엄마 설명서 · 시험 화면</h1>

  <div class="box ok">
    <b>이 글이 보이면 성공이에요.</b><br>
    아이패드에서 이 주소가 열린다는 뜻이에요.
  </div>

  <div class="box">
    아래에 <b>베이지색 네모 안에 빨간 동그라미와 초록 네모</b>가 보이면 그림도 잘 나오는 거예요.
  </div>

  <img src="img/test.png?v=1" alt="시험용 그림: 빨간 동그라미 안 초록 네모">

  <p class="small">시험 페이지 · 2026-10-11</p>
</body>
</html>
