<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-title" content="엄마전용 휴대폰 설명서">
<title>쿠팡에서 물건 사기</title>
<link rel="stylesheet" href="../style.css?v=81968569">
<noscript><meta http-equiv="refresh" content="0; url=1.html"></noscript>
</head>
<body>
<div id="stage">
  <div id="sheetBox"><img id="sheet" src="" alt=""></div>
  <div id="zonePrev" class="zone"><span class="arrow"><i></i></span></div>
  <div id="zoneNext" class="zone"><span class="arrow"><i></i></span></div>
  <div id="sideInfo"><div class="count" id="countLabel"></div><div class="track"><div class="fill" id="fillBar"></div></div></div>
  <p id="whereTitle">쿠팡에서 물건 사기</p>
  <div id="endBanner" hidden>끝까지 다 보셨어요. 잘하셨어요!</div>
</div>
<script>
(function () {
  var PAGES = ["img/p01.png?v=033251bd", "img/p02.png?v=f58443e5", "img/p03.png?v=21f2acd9", "img/p04.png?v=aa8c5a0f", "img/p05.png?v=4bc71641", "img/p06.png?v=bee3c605", "img/p07.png?v=c2dffd82", "img/p08.png?v=c5a4d799", "img/p09.png?v=8b14bbca", "img/p10.png?v=96d00240", "img/p11.png?v=66a6536e", "img/p12.png?v=3abfd550", "img/p13.png?v=dde226ed", "img/p14.png?v=9d461638"];
  var TITLES = ["쿠팡에서 물건 사는 방법", "쿠팡 열고 물건 찾기", "목록에서 하나 고르기", "개수 정하고 바로구매", "받는 곳을 \"디스\"로 고르기", "결제를 엄마 국민카드로 바꾸기", "돈 확인하고 결제하기", "KB Pay에서 비밀번호 누르기", "주문 완료 확인하기", "잘못 샀을 때 취소하기", "쿠팡인 척하는 사기 구별하기", "헷갈리면 직접 거는 번호", "엄마가 적어 두는 칸", "가족이 알아 두면 좋은 것"];
  var i = 0;
  var n = PAGES.length;
  var sheet = document.getElementById('sheet');
  var count = document.getElementById('countLabel');
  var fill = document.getElementById('fillBar');
  var zonePrev = document.getElementById('zonePrev');
  var zoneNext = document.getElementById('zoneNext');
  var endBanner = document.getElementById('endBanner');
  var pre = new Image();

  function render() {
    sheet.src = PAGES[i];
    sheet.alt = (i + 1) + '쪽: ' + TITLES[i];
    count.textContent = (i + 1) + ' / ' + n;
    fill.style.height = Math.round((i + 1) / n * 100) + '%';
    zonePrev.className = 'zone' + (i === 0 ? ' off' : '');
    zoneNext.className = 'zone' + (i === n - 1 ? ' off' : '');
    endBanner.hidden = (i !== n - 1);
    if (i + 1 < n) { pre.src = PAGES[i + 1]; }
    if (i > 0) { pre.src = PAGES[i - 1]; }
  }

  function tryFullscreen() {
    try {
      var el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) {
        el.requestFullscreen().catch(function () {});
      }
    } catch (e) {}
  }

  zoneNext.addEventListener('click', function () {
    if (i < n - 1) { i++; render(); }
    tryFullscreen();
  });
  zonePrev.addEventListener('click', function () {
    if (i > 0) { i--; render(); }
    tryFullscreen();
  });

  render();
})();
</script>
</body>
</html>
